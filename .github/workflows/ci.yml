name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: tvOS build & unit tests
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install Tuist
        run: brew install tuist

      - name: Generate Xcode project
        run: tuist generate --path tvosApp --no-open

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace tvosApp/NuvioTV.xcworkspace \
            -scheme NuvioTV

      - name: Build for tvOS Simulator
        run: |
          xcodebuild build \
            -workspace tvosApp/NuvioTV.xcworkspace \
            -scheme NuvioTV \
            -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath build/ci-derived \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          set -euo pipefail
          DESTINATION="$(
            python3 - <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          ))
          for runtime, devices in data.get("devices", {}).items():
              if "tvOS" not in runtime:
                  continue
              for device in devices:
                  if not device.get("isAvailable", True):
                      continue
                  name = device.get("name", "")
                  if "Apple TV" in name:
                      print(f"platform=tvOS Simulator,id={device['udid']}")
                      sys.exit(0)
          print("platform=tvOS Simulator,name=Apple TV")
          PY
          )"
          echo "Using destination: ${DESTINATION}"
          xcodebuild test \
            -workspace tvosApp/NuvioTV.xcworkspace \
            -scheme NuvioTV \
            -destination "${DESTINATION}" \
            -derivedDataPath build/ci-derived \
            -only-testing:NuvioTVTests \
            CODE_SIGNING_ALLOWED=NO
